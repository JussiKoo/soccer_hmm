[build-system]
requires = ["uv_build >= 0.13, <0.14"]
build-backend = "uv_build"

[project]
name = "soccer_hmm"
version = "0.0.1"
description = "Multivariate Bayesian HMM for tracking data"
authors = [
  { name = "Jussi Kauppinen" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = ">=3.12"

dependencies = [
    "arviz==0.23.0",
    "arviz-stats",
    "arviz-base",
    "cmdstanpy",
    "loguru",
    "matplotlib",
    "numpy",
    "pandas",
    "python-dotenv",
    "PyYAML",
    "scipy",
    "scienceplots",
    "seaborn",
    "statsmodels",
    "tqdm",
    "typer",
]

[project.scripts]
soccer-hmm = "soccer_hmm.cli:app"

[tool.uv.build-backend]
module-name = "soccer_hmm"
module-root = "."
source-exclude = [
    ".env",
    ".venv/**",
    "build/**",
    "data/**",
    "dist/**",
    "models/**",
    "notebooks/**",
    "stan/**/*.exe",
]